[workspace]
authors = ["Maulik Madhavi <maulikmadhavi@gmail.com>"]
channels = ["conda-forge"]
name = "dev_ir_result_analysis"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
gen-data = "python scripts/gen_fake_data.py"
start = "python app.py --csv data/sample.csv"
test = "pytest tests/ -v"

[dependencies]
python = ">=3.14.5,<3.15"
pip = ">=26.1.2,<27"

[pypi-dependencies]
flask = ">=3.1.3, <4"
pandas = ">=2.2, <3"
numpy = ">=2.0, <3"
pillow = ">=11.0, <12"
pytest = ">=8.0, <9"
